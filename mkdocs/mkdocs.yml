site_name: Stylus Manager
site_description: Manage Stylus contract activation, caching, automation, and alerts on Arbitrum.
docs_dir: docs/en
repo_url: https://github.com/cobuilders-xyz/stylus-cm-deploy
edit_uri: edit/main/mkdocs/docs/en
site_url: https://cobuilders-xyz.github.io/stylus-cm-deploy

nav:
  - Welcome: index.md
  - What's New in v2: releases/stylus-manager-v2.md
  - Getting Started:
      - Activation & Caching Basics: getting-started/cache-manager-basics.md
      - Stylus Manager UI:
          - Overview: getting-started/stylus-cache-manager-ui/overview.md
          - Tutorials:
              - Login Wallet: getting-started/stylus-cache-manager-ui/tutorials/login-wallet.md
              - My Contracts: getting-started/stylus-cache-manager-ui/tutorials/my-contracts.md
              - Activate a Contract: getting-started/stylus-cache-manager-ui/tutorials/activation.md
              - Auto-activation: getting-started/stylus-cache-manager-ui/tutorials/auto-activation.md
              - Place a Bid: getting-started/stylus-cache-manager-ui/tutorials/place-bid.md
              - Cache Bid Automation: getting-started/stylus-cache-manager-ui/tutorials/bid-automation.md
              - Gas Tank: getting-started/stylus-cache-manager-ui/tutorials/gas-tank.md
              - Alerts: getting-started/stylus-cache-manager-ui/tutorials/alerts.md
  - Tutorials:
      - Contract Activation: tutorials/activation.md
      - Contract Caching: tutorials/caching.md
  - Deep Dive:
      - Overview: deep-dive/overview.md
      - Fundamentals:
          - Activation Lifecycle: deep-dive/activation-lifecycle.md
          - Effective Bid: deep-dive/effective-bid.md
          - Bid suggestions: deep-dive/bid-suggestions.md
          - Eviction Risk: deep-dive/eviction-risk.md
          - Place Bid: deep-dive/place-bid.md
          - Cache Bid Automation: deep-dive/bid-automations.md
  - API Reference: api-reference.md
  - Deployment:
      - Arbitrum Knowledge Base:
          - Deploy Local Testnode: local-deployment/arbitrum/deployment.md
          - Arbitrum Chains: local-deployment/arbitrum/arbitrum-chains.md
          - Playground:
              - Install Cargo Stylus: local-deployment/arbitrum/playground/cargo-stylus.md
              - CacheManager Cheatsheet: local-deployment/arbitrum/playground/cm-interactions.md
              - Guided Testing: local-deployment/arbitrum/playground/guided-testing.md
      - Stylus Manager:
          - Overview: local-deployment/stylus-cache-manager-ui/overview.md
          - Clone the Repository: local-deployment/stylus-cache-manager-ui/clone-the-repo.md
          - Deploy Automation Contracts: local-deployment/stylus-cache-manager-ui/deploy-cma-contracts.md
          - ThirdWeb Engine: local-deployment/stylus-cache-manager-ui/third-web-engine.md
          - Backend: local-deployment/stylus-cache-manager-ui/scm-ui-backend.md
          - Frontend: local-deployment/stylus-cache-manager-ui/scm-ui-frontend.md

theme:
  name: material
  logo: assets/cobuilders-logo.png
  favicon: assets/cobuilders-favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: black
      accent: gray
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: gray
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
  font:
    text: Roboto
  language: en
  features:
    # - navigation.instant
    # - navigation.instant.progress
    # - navigation.tabs
    - navigation.sections
    # - navigation.expand
    - navigation.indexes
    - navigation.path
    - toc.follow
    # - toc.integrate
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - content.tabs.link
    - search.highlight
    - search.share
    - search.suggest

extra:
  homepage: https://cobuilders.xyz
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
  status:
    new: Recently added
    deprecated: Deprecated
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cobuilders-xyz/stylus-cm-deploy
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
